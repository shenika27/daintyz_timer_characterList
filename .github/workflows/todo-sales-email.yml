name: 코드 메일 발송

# Worker(daintyz-skin-inbox)가 관리자 '메일 발송' 클릭 시 job_id로 디스패치한다.
# 코드·이메일 원문은 이 워크플로 입력/로그에 넣지 않고, 인증 콜백으로 Worker에서만 가져온다.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 발송 작업 ID (Worker가 생성)
        required: true

concurrency:
  group: todo-sales-email-${{ github.event.inputs.job_id }}
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 코드 메일 발송 (네이버 SMTP)
        env:
          WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL || 'https://daintyz-skin-inbox.xornexon.workers.dev' }}
          TODO_MAIL_SECRET: ${{ secrets.TODO_MAIL_SECRET }}
          NAVER_USER: ${{ secrets.NAVER_USER }}
          NAVER_PASS: ${{ secrets.NAVER_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: python scripts/send_sales_email.py
