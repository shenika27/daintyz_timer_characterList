<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="daintyz 캐릭터 빌더 로그인 및 작업 선택">
  <title>daintyz builder</title>
  <link rel="stylesheet" href="./shared/builder-shell.css">
</head>
<body class="builder-shell">
  <main class="builder-login-view" id="loginView">
    <form class="builder-login-card" id="loginForm">
      <div class="builder-login-mark" aria-hidden="true">✦</div>
      <h1>daintyz builder</h1>
      <p class="builder-login-sub">로그인한 뒤 작업할 빌더를 선택해 주세요.</p>

      <label for="loginUsername">아이디</label>
      <input type="text" id="loginUsername" autocomplete="username" maxlength="64" required>

      <label for="loginPassword">비밀번호</label>
      <input type="password" id="loginPassword" autocomplete="current-password" maxlength="1024" required>

      <label class="builder-check" for="loginSaveId">
        <input type="checkbox" id="loginSaveId"> 아이디 저장
      </label>
      <label class="builder-check" for="loginRemember">
        <input type="checkbox" id="loginRemember"> 자동로그인 (30일)
      </label>

      <button class="builder-primary" type="submit" id="loginButton">로그인</button>
      <p class="builder-error" id="loginError" role="alert" aria-live="polite"></p>
    </form>
  </main>

  <div id="builderHome" hidden>
    <header class="builder-topbar">
      <a class="builder-brand" href="./">daintyz builder</a>
      <nav class="builder-switcher" aria-label="빌더 전환">
        <a href="./timer-builder/">타이머 위젯</a>
        <a href="./todo-builder/">CharacterTodo</a>
      </nav>
      <div class="builder-account">
        <span id="authUsername"></span>
        <button class="builder-logout" type="button" id="logoutButton">로그아웃</button>
      </div>
    </header>

    <main class="builder-page">
      <section class="builder-hero">
        <p class="builder-eyebrow">BUILDER HOME</p>
        <h1>어떤 캐릭터를 작업하시겠어요?</h1>
        <p>한 번 로그인하면 두 빌더 사이를 이동해도 같은 세션이 유지됩니다.</p>
      </section>

      <section class="builder-grid" aria-label="빌더 선택">
        <a class="builder-card" href="./timer-builder/">
          <div class="builder-card-mark" aria-hidden="true">⏱</div>
          <h2>타이머 위젯</h2>
          <p>Android 타이머 위젯의 이미지, 동작, 상품 정보를 구성합니다.</p>
          <span class="builder-card-cta">timer-builder 열기 →</span>
        </a>
        <a class="builder-card" href="./todo-builder/">
          <div class="builder-card-mark" aria-hidden="true">✓</div>
          <h2>CharacterTodo</h2>
          <p>PC 투두 앱용 캐릭터 테마와 판매 코드를 관리합니다.</p>
          <span class="builder-card-cta">todo-builder 열기 →</span>
        </a>
      </section>
    </main>
  </div>

  <script src="./shared/builder-auth.js"></script>
  <script>
    const loginView = document.getElementById("loginView");
    const builderHome = document.getElementById("builderHome");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const loginError = document.getElementById("loginError");
    const usernameInput = document.getElementById("loginUsername");
    const passwordInput = document.getElementById("loginPassword");
    const saveIdInput = document.getElementById("loginSaveId");

    function showLogin(message = "") {
      builderHome.hidden = true;
      loginView.hidden = false;
      loginError.textContent = message;
      passwordInput.value = "";
      const saved = BuilderAuth.savedUsername();
      usernameInput.value = saved;
      saveIdInput.checked = Boolean(saved);
      setTimeout(() => (saved ? passwordInput : usernameInput).focus(), 0);
    }

    function showHome(username) {
      document.getElementById("authUsername").textContent = `${username}님`;
      loginView.hidden = true;
      builderHome.hidden = false;
    }

    function continueToRequestedRoute() {
      const route = BuilderAuth.requestedRoute(window.location.search);
      if (!route) return false;
      window.location.replace(route);
      return true;
    }

    async function initialize() {
      BuilderAuth.clearLegacyStorage();
      try {
        const { response, data } = await BuilderAuth.session();
        if (response.ok && data.ok) {
          if (!continueToRequestedRoute()) showHome(data.username);
          return;
        }
        if (response.status === 401 && data.reason === "missing") {
          showLogin();
          return;
        }
      } catch {}
      showLogin("로그인 서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.");
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginButton.disabled = true;
      loginButton.textContent = "확인 중…";
      loginError.textContent = "";
      const username = usernameInput.value.trim();
      try {
        const data = await BuilderAuth.login({
          username,
          password: passwordInput.value,
          rememberMe: document.getElementById("loginRemember").checked,
        });
        BuilderAuth.saveUsername(username, saveIdInput.checked);
        passwordInput.value = "";
        if (!continueToRequestedRoute()) showHome(data.username);
      } catch (error) {
        loginError.textContent = error.message || "로그인 서버에 연결하지 못했습니다.";
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "로그인";
      }
    });

    document.getElementById("logoutButton").addEventListener("click", async () => {
      await BuilderAuth.logout();
      showLogin("로그아웃되었습니다.");
    });

    initialize();
  </script>
</body>
</html>
